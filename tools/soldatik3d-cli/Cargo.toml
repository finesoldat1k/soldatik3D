[package]
name = "soldatik3d-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "CLI tool for Soldatik3D game development: project creation, building, exporting"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
indicatif = "0.17"
console = "0.15"
fs_extra = "1.3"