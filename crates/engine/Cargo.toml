[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public runtime facade of the Soldatik3D engine"

[features]
default = ["vulkan"]
# Enables the `engine-vulkan` backend. Disable it to build an engine facade
# without a graphics API (useful for tooling crates or alternative backends).
vulkan = ["dep:engine-vulkan"]

[dependencies]
engine-core = { workspace = true }
engine-render = { workspace = true }
engine-platform = { workspace = true }
engine-vulkan = { workspace = true, optional = true }
anyhow = { workspace = true }
