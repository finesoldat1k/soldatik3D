[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public runtime facade of the Soldatik3D engine"

[features]
# Desktop builds get both backends. On Android the Vulkan dependency is
# target-gated in the `vulkan` crate and the runtime backend arm is compiled
# out, so enabling the feature there is harmless.
default = ["vulkan", "opengl"]
vulkan = ["dep:vulkan"]
opengl = ["dep:opengl"]

[dependencies]
scene = { workspace = true }
assets = { workspace = true }
ui = { workspace = true }
render = { workspace = true }
platform = { workspace = true }
opengl = { workspace = true, optional = true }
anyhow = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
vulkan = { workspace = true, optional = true }
