[package]
name = "s3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soldatik3D development toolchain: project creation, building, exporting"
publish = false

[[bin]]
name = "s3d"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
indicatif = "0.17"
console = "0.15"
fs_extra = "1.3"