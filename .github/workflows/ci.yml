name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # shaderc-sys 0.8 vendors CMake projects with pre-3.5 policy minimums.
  # CMake 4 otherwise refuses to configure them; older CMake ignores this.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build git python3 \
            libvulkan-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libshaderc-dev
          # Ubuntu's libshaderc-dev ships a `libshaderc_combined.a` that is
          # not actually combined: it lacks the glslang/SPIRV-Tools members
          # and fails only when the demo executable is linked. Point
          # shaderc-sys at the real shared library instead (the package also
          # provides libshaderc.so.1).
          if [ -e /usr/lib/x86_64-linux-gnu/libshaderc.so.1 ]; then
            mkdir -p /tmp/shaderc-lib
            ln -sf /usr/lib/x86_64-linux-gnu/libshaderc.so.1 /tmp/shaderc-lib/libshaderc_shared.so
            echo "SHADERC_LIB_DIR=/tmp/shaderc-lib" >> "$GITHUB_ENV"
            echo "Using system libshaderc shared library"
          else
            echo "System shaderc unavailable; shaderc will be built from source"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Build engine (runtime)
        run: cargo build --locked -p runtime --all-features

      - name: Build demo game
        run: cargo build --locked -p demo --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Package CI artifacts
        run: |
          mkdir -p dist/engine dist/demo
          cp target/debug/libruntime.rlib dist/engine/
          cp target/debug/demo dist/demo/
          tar -czf dist/soldatik3d-engine-linux-x86_64.tar.gz -C dist/engine .
          tar -czf dist/soldatik3d-demo-linux-x86_64.tar.gz -C dist/demo .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          retention-days: 14

  windows:
    name: Windows x86_64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Build engine (runtime)
        run: cargo build --locked -p runtime --all-features

      - name: Build demo game
        run: cargo build --locked -p demo --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Package CI artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\engine, dist\demo | Out-Null
          Copy-Item target\debug\libruntime.rlib dist\engine\
          Copy-Item target\debug\demo.exe dist\demo\
          Compress-Archive -Force -Path dist\engine\* -DestinationPath dist\soldatik3d-engine-windows-x86_64.zip
          Compress-Archive -Force -Path dist\demo\* -DestinationPath dist\soldatik3d-demo-windows-x86_64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          retention-days: 14

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            linker: aarch64-linux-android29-clang
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            linker: armv7a-linux-androideabi29-clang
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}

      - name: Configure NDK linker
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/${{ matrix.linker }}"
          echo "${{ matrix.linker_env }}=$NDK_BIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_${{ matrix.target }}=$NDK_BIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "AR_${{ matrix.target }}=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build engine (runtime, OpenGL ES)
        run: |
          cargo build --locked -p runtime \
            --no-default-features --features opengl \
            --target ${{ matrix.target }}

      - name: Build demo game (OpenGL ES)
        run: |
          cargo build --locked -p demo \
            --no-default-features --features opengl \
            --target ${{ matrix.target }}

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmake-version: 3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          # Build native libraries first (already done above)
          # Now build the APK using the gradle template
          GRADLE_DIR="android/gradle"
          mkdir -p "$GRADLE_DIR"
          # Use the source of truth Gradle template from scripts/apk/
          rsync -a --delete "scripts/apk/gradle/" "$GRADLE_DIR/"
          
          # Copy native library to jniLibs
          ABI="${{ matrix.abi }}"
          RUST_TARGET="${{ matrix.target }}"
          PROFILE="debug"
          NATIVE_LIB="target/$RUST_TARGET/$PROFILE/libdemo.so"
          JNI_LIBS_DIR="$GRADLE_DIR/app/src/main/jniLibs/$ABI"
          mkdir -p "$JNI_LIBS_DIR"
          cp "$NATIVE_LIB" "$JNI_LIBS_DIR/libdemo.so"
          
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # Copy APK to dist
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_APK="../../apk/app-${{ matrix.abi }}-debug.apk"
          mkdir -p ../../apk
          cp "$APK_PATH" "$OUTPUT_APK"
          cd ../..

      - name: Package CI artifacts
        run: |
          mkdir -p dist/engine dist/demo
          cp "target/${{ matrix.target }}/debug/libruntime.rlib" dist/engine/
          # The demo is a native-activity cdylib on Android.
          cp "target/${{ matrix.target }}/debug/libdemo.so" dist/demo/
          # Also copy the APK
          cp "apk/app-${{ matrix.abi }}-debug.apk" dist/demo/
          tar -czf "dist/soldatik3d-engine-android-${{ matrix.abi }}.tar.gz" -C dist/engine .
          tar -czf "dist/soldatik3d-demo-android-${{ matrix.abi }}.tar.gz" -C dist/demo .

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: dist/
          retention-days: 14
