name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: Linux (Ubuntu latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: target/debug/
          retention-days: 7

  windows:
    name: Windows (latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1
        with:
          version: "1.3.283.0"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-build
          path: target/debug/
          retention-days: 7

  android:
    name: Android (API 29+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r26c
          api-level: 29

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev \
            openjdk-17-jdk-headless

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (host target only)
        run: cargo clippy --workspace --all-targets --all-features --target x86_64-unknown-linux-gnu

      - name: Build for Android targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            echo "Building for $target..."
            cargo build --workspace --all-features --target $target
          done

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-build
          path: target/*-linux-android*/debug/
          retention-days: 7

  windows-cross:
    name: Windows Cross-Compile (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            wine64 \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-gnu

      - name: Build Windows cross-compile
        run: cargo build --workspace --all-features --target x86_64-pc-windows-gnu

      - name: Upload Windows cross-compile artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-cross-build
          path: target/x86_64-pc-windows-gnu/debug/
          retention-days: 7

  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --all-features --release

      - name: Run release tests
        run: cargo test --workspace --all-features --release

      - name: Create release archives
        run: |
          mkdir -p release
          # Linux
          tar -czf release/soldatik3d-linux-x86_64.tar.gz -C target/release demo
          # Windows (cross-compiled)
          cargo install cross
          cross build --workspace --all-features --release --target x86_64-pc-windows-gnu
          zip -r release/soldatik3d-windows-x86_64.zip target/x86_64-pc-windows-gnu/release/demo.exe

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
          retention-days: 30