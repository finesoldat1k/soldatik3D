name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: Linux (Ubuntu latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev \
            clang lld

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "vulkan opengl"

      - name: Build workspace
        run: cargo build --workspace --features "vulkan opengl"

      - name: Run tests
        run: cargo test --workspace --features "vulkan opengl"

      - name: Build docs
        run: cargo doc --workspace --no-deps --features "vulkan opengl"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: target/debug/
          retention-days: 7

  windows:
    name: Windows (native MSVC)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1
        with:
          version: "1.3.283.0"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "vulkan opengl"

      - name: Build workspace
        run: cargo build --workspace --features "vulkan opengl"

      - name: Run tests
        run: cargo test --workspace --features "vulkan opengl"

      - name: Build docs
        run: cargo doc --workspace --no-deps --features "vulkan opengl"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-build
          path: target/debug/
          retention-days: 7

  android:
    name: Android (API 29+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r26c
          api-level: 29

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev \
            openjdk-17-jdk-headless

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (host target only)
        run: cargo clippy --workspace --all-targets --features "opengl" --target x86_64-unknown-linux-gnu

      - name: Configure cargo for Android
        run: |
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      - name: Build for Android targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            echo "Building for $target..."
            cargo build --workspace --features "opengl" --target $target
          done

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-build
          path: target/*-linux-android*/debug/
          retention-days: 7

  windows-cross:
    name: Windows Cross-Compile (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            binutils-mingw-w64-x86-64 \
            wine64 \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev \
            clang lld

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "vulkan opengl" --target x86_64-pc-windows-gnu

      - name: Build Windows cross-compile
        run: cargo build --workspace --features "vulkan opengl" --target x86_64-pc-windows-gnu

      - name: Upload Windows cross-compile artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-cross-build
          path: target/x86_64-pc-windows-gnu/debug/
          retention-days: 7

  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            binutils-mingw-w64-x86-64 \
            wine64

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux release
        run: cargo build --workspace --features "vulkan opengl" --release

      - name: Build Windows cross-compile release
        run: |
          cargo build --workspace --features "vulkan opengl" --release --target x86_64-pc-windows-gnu

      - name: Build Android release
        run: |
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            echo "Building Android release for $target..."
            cargo build --workspace --features "opengl" --release --target $target
          done

      - name: Run release tests
        run: cargo test --workspace --all-features --release

      - name: Create release archives
        run: |
          mkdir -p release
          # Linux
          tar -czf release/soldatik3d-linux-x86_64.tar.gz -C target/release examples/demo
          # Windows (cross-compiled)
          tar -czf release/soldatik3d-windows-x86_64.tar.gz -C target/x86_64-pc-windows-gnu/release examples/demo.exe
          # Android
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            abi=$(case $target in aarch64-linux-android) echo arm64-v8a;; armv7-linux-androideabi) echo armeabi-v7a;; x86_64-linux-android) echo x86_64;; esac)
            tar -czf release/soldatik3d-android-${abi}.tar.gz -C target/${target}/release examples/demo
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
          retention-days: 30