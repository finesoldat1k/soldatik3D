name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  android-release:
    name: Android Release (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            api: 29
            abi: arm64-v8a
          - arch: armv7
            target: armv7-linux-androideabi
            api: 29
            abi: armeabi-v7a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r26c
          api-level: ${{ matrix.api }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev vulkan-validationlayers-dev spirv-tools \
            libx11-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            cmake pkg-config libssl-dev \
            openjdk-17-jdk-headless

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure cargo for Android
        run: |
          cat >> ~/.cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${{ matrix.api }}-clang"
          ar = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      - name: Build release
        run: |
          cargo build --workspace --all-features --target ${{ matrix.target }} --release

      - name: Create release package
        run: |
          mkdir -p release/android
          cp target/${{ matrix.target }}/release/demo release/android/soldatik3d-${{ matrix.abi }}
          cat > release/android/README-${{ matrix.abi }}.md <<EOF
          # Soldatik3D Android Binary (${{ matrix.abi }})

          This is a standalone native binary for Android ${{ matrix.abi }}.
          To run it, you need:
          1. Android device with API ${{ matrix.api }}+ (Android 10+)
          2. Vulkan 1.1+ support
          3. Root access or termux with proot

          Usage:
          \`\`\`bash
          adb push soldatik3d-${{ matrix.abi }} /data/local/tmp/
          adb shell chmod +x /data/local/tmp/soldatik3d-${{ matrix.abi }}
          adb shell /data/local/tmp/soldatik3d-${{ matrix.abi }}
          \`\`\`

          Environment variables:
          - SOLDATIK3D_BACKEND=vulkan|opengl
          - SOLDATIK3D_VSYNC=on|off|mailbox|adaptive
          - SOLDATIK3D_MAX_FRAMES=N (for headless testing)
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ matrix.abi }}
          path: release/android/
          retention-days: 90