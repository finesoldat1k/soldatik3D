# Cargo configuration for Soldatik3D.
#
# Cross-compilation is configured from the command line / CI environment so
# that this file stays valid on every host. In particular, do not put
# `[target.'cfg(...)'.dependencies]`, `[features]` or `[workspace]` sections
# here: those belong to Cargo.toml files and are rejected by Cargo in config.
#
# Android linkers are supplied by CI and cross_build.sh through
# CARGO_TARGET_<TRIPLE>_LINKER (see docs/CI.md).

[net]
git-fetch-with-cli = true

# Keep debug builds usable for a 3D engine while retaining symbols. The
# workspace Cargo.toml already optimizes third-party dependencies; this also
# optimizes the engine and demo crates themselves.
[profile.dev]
opt-level = 3
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = false
