# Cargo configuration for Soldatik3D game projects.
#
# This file intentionally does not force a linker: the defaults work on a
# normal Rust toolchain. Android linkers are supplied by build_apk.sh (or by
# CI) through CARGO_TARGET_<TRIPLE>_LINKER and CC_<TRIPLE> variables.

[net]
git-fetch-with-cli = true

# Debug profile - optimized for development with symbols.
[profile.dev]
opt-level = 3
debug = true
split-debuginfo = "unpacked"

# Release profile - maximum optimization.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = false

# Android targets:
#   rustup target add aarch64-linux-android armv7-linux-androideabi
#   export ANDROID_NDK_HOME=$HOME/android-ndk-r26c
#
# Windows builds:
#   Native MSVC builds work with the default toolchain. Cross-compiling from
#   Linux to Windows requires the x86_64-pc-windows-gnu target and MinGW-w64.
