[package]
name = "my_game"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/yourname/my_game"
description = "A game built with Soldatik3D engine"
publish = false

# Opt out of the parent workspace when the project is generated inside the
# engine repository. Keep this so the game builds on its own.
[workspace]

[lib]
# `cdylib` is the Android native-activity library; `rlib` lets the desktop
# binary in src/main.rs reuse the same game code.
crate-type = ["cdylib", "rlib"]

[features]
default = ["vulkan", "opengl"]
vulkan = ["runtime/vulkan"]
opengl = ["runtime/opengl"]

[dependencies]
# `s3d new` rewrites this path to point at the engine checkout you used to
# create the project. For a hand-written project, point it at the engine's
# crates/runtime directory or use a git dependency.
runtime = { path = "../crates/runtime", default-features = false }
anyhow = "1.0"

# Android native-activity entry point.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
