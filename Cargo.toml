[workspace]
resolver = "3"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-platform",
    "crates/engine-vulkan",
    "crates/engine",
    "crates/game",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/finesoldat1k/soldatik3D"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
glam = "0.29"
shaderc = "0.8"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

engine-core = { path = "crates/engine-core" }
engine-render = { path = "crates/engine-render" }
engine-platform = { path = "crates/engine-platform" }
engine-vulkan = { path = "crates/engine-vulkan" }
engine = { path = "crates/engine" }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
