[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/text",
    "crates/scene",
    "crates/ui",
    "crates/render",
    "crates/platform",
    "crates/vulkan",
    "crates/opengl",
    "crates/runtime",
    "crates/s3d",
    "examples/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/finesoldat1k/soldatik3D"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
glam = "0.29"
shaderc = "0.8"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
glutin = "0.32"
glow = "0.18"
# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
indicatif = "0.17"
console = "0.15"
fs_extra = "1.3"

assets = { path = "crates/assets" }
text = { path = "crates/text" }
scene = { path = "crates/scene" }
ui = { path = "crates/ui" }
render = { path = "crates/render" }
platform = { path = "crates/platform" }
vulkan = { path = "crates/vulkan" }
opengl = { path = "crates/opengl" }
runtime = { path = "crates/runtime", default-features = false }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
