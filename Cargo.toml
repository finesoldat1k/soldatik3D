[workspace]
resolver = "3"
members = [
    "crates/assets",
    "crates/scene",
    "crates/ui",
    "crates/render",
    "crates/platform",
    "crates/vulkan",
    "crates/opengl",
    "crates/runtime",
    "examples/demo",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/finesoldat1k/soldatik3D"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
glam = "0.29"
shaderc = "0.8"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
glutin = "0.32"
glow = "0.18"

assets = { path = "crates/assets" }
scene = { path = "crates/scene" }
ui = { path = "crates/ui" }
render = { path = "crates/render" }
platform = { path = "crates/platform" }
vulkan = { path = "crates/vulkan" }
opengl = { path = "crates/opengl" }
runtime = { path = "crates/runtime" }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
